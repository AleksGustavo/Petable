name: CodeQL

# Análise estática (SAST) de Java e TypeScript.
# O repositório é PRIVADO e sem GitHub Code Security (pago): o GitHub não aceita o envio dos
# resultados para a aba Security ("Code scanning is not enabled"). Por isso o resultado fica como
# artefato (SARIF) e o job REPROVA se houver achado de nível "error". Com Code Security ativo,
# troque `upload: never` por `upload: always`, devolva `security-events: write` e remova os passos 2 e 3.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read          # exigido pelo CodeQL em repositório privado
  contents: read

jobs:
  analyze:
    name: Análise (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # 1) Analisa e grava o SARIF localmente (sem enviar ao GitHub).
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          upload: never
          output: sarif-resultados

      # 2) Guarda o resultado para consulta.
      - name: Guardar resultado (SARIF)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-resultados/
          retention-days: 30

      # 3) Reprova com achado de nível "error".
      - name: Falhar com achados graves
        run: |
          total="$(jq -s '[.[].runs[].results[]? | select(.level == "error")] | length' sarif-resultados/*.sarif)"
          echo "Achados de nível error (${{ matrix.language }}): $total"
          if [ "$total" -gt 0 ]; then
            jq -r -s '.[].runs[].results[]? | select(.level == "error") | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-resultados/*.sarif
            exit 1
          fi
