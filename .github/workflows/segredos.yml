name: Segredos

# Prevenção: procura segredos nos commits do PR (ou do push) e dados pessoais em dumps versionados.
# Não substitui o secret scanning/push protection do GitHub nem a revisão humana de dados pessoais.
# Roda em todo PR (sem filtro `paths`) para poder ser check obrigatório.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segredos-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, conferido contra o checksums.txt da release oficial.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  varredura:
    name: Segredos e dados pessoais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binário oficial, checksum fixado)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact: o log nunca mostra o valor encontrado.
      - name: Segredos nos commits do PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: ./gitleaks git --redact --verbose --no-banner --log-opts="origin/${BASE}..HEAD" .

      - name: Segredos nos commits do push
        if: github.event_name == 'push'
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then ANTES="${DEPOIS}~1"; fi
          ./gitleaks git --redact --verbose --no-banner --log-opts="${ANTES}..${DEPOIS}" .

      - name: Segredos na árvore atual
        if: github.event_name == 'workflow_dispatch'
        run: ./gitleaks dir --redact --verbose --no-banner .

      - name: Dados pessoais em dumps (padrão de CPF)
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            scripts/verificar-dados-sensiveis.sh "origin/${BASE}...HEAD"
          else
            scripts/verificar-dados-sensiveis.sh
          fi
