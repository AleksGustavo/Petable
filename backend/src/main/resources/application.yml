# Configuração base. Valores sensíveis SEMPRE via variável de ambiente
# (ver .env.example na raiz do repositório). Perfis: dev (padrão), prod.
spring:
  application:
    name: petconnect-web-api
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/petconnect_web}
    username: ${MYSQL_USER:petconnect}
    password: ${MYSQL_PASSWORD:petconnect}
    # Banco LEGADO (etapa 08): só lido pela migração offline, com usuário somente SELECT.
    legacy:
      url: ${LEGADO_DB_URL:}
      username: ${LEGADO_DB_USERNAME:}
      password: ${LEGADO_DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é do Flyway, nunca do Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27019/petconnect_web}
  mail:
    # Dev/Docker: Mailpit (sem TLS/autenticação). Produção: SMTP real pelas mesmas variáveis.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # A regra de negócio é 5 MB (FotoPetService); a folga cobre o overhead do multipart.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  health:
    # SMTP fora do ar não pode derrubar o readiness da API.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Base dos links enviados por e-mail (ex.: redefinição de senha).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  email:
    remetente: ${EMAIL_REMETENTE:PetConnect Web <nao-responda@petconnect.local>}
  security:
    jwt:
      # >= 32 bytes. Em dev há um valor padrão só para subir local; em prod é obrigatório.
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      issuer: petconnect-web-api
      ttl: ${JWT_TTL:PT8H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

petconnect:
  # Módulos contratados desta instalação (etapa 07, docs/implementacao/06_CATALOGO_MODULOS.md). 'todos' = todos os módulos existentes
  # (padrão das instalações já existentes). Em instalação de cliente, liste os ids: pdv,caixa,produtos,estoque. O que não está na lista é negado.
  modulos: ${PETCONNECT_MODULOS:todos}
  storage:
    # Fotos dos pets. No Docker é o volume /data/uploads; nos testes, um diretório em target/.
    pets: ${PETS_STORAGE_DIR:./data/uploads/pets}
  # Migração do sistema PHP (etapa 08, ver docs/migracao-legado.md). Desligada no boot normal;
  # quando ligada, o padrão é DRY-RUN (nada é gravado).
  migracao:
    legado: ${PETCONNECT_MIGRACAO_LEGADO:false}
    dry-run: ${PETCONNECT_MIGRACAO_DRY_RUN:true}
    lote: ${PETCONNECT_MIGRACAO_LOTE:500}
    relatorio-dir: ${PETCONNECT_MIGRACAO_RELATORIO_DIR:build/migracao-relatorios}
    fotos-dir: ${PETCONNECT_MIGRACAO_FOTOS_DIR:}
    viacep:
      enabled: ${PETCONNECT_MIGRACAO_VIACEP:false}
      timeout-ms: ${PETCONNECT_MIGRACAO_VIACEP_TIMEOUT_MS:1500}
    backfill-servico-forma: ${PETCONNECT_MIGRACAO_BACKFILL_SERVICO_FORMA:}
    encerrar-ao-final: ${PETCONNECT_MIGRACAO_ENCERRAR:true}
  # Controle de lote e validade (docs/implementacao/01_DECISOES_LOTES.md). Desligado por padrao (D22):
  # desligado, o sistema se comporta como antes dos lotes.
  estoque:
    lotes:
      habilitado: ${PETCONNECT_ESTOQUE_LOTES:false}
      dias-bloqueio-antes-validade: ${PETCONNECT_ESTOQUE_LOTES_DIAS_BLOQUEIO:0}
      faixas-alerta-dias: ${PETCONNECT_ESTOQUE_LOTES_FAIXAS_ALERTA:30,60,90}
