# Produção: sem defaults para segredos — a aplicação não sobe se faltarem.
spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  mongodb:
    uri: ${MONGODB_URI}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
