# Stack completa do PetConnect Web para desenvolvimento.
#
#   cp .env.example .env              # e ajuste as senhas
#   docker compose up -d --build      # MySQL + MongoDB + API + Web
#   docker compose up -d mysql mongo  # só os bancos (API/Web pela IDE)
#   docker compose logs -f api
#   docker compose down               # para (mantém dados)   | down -v apaga os dados
#
# Portas no host configuráveis no .env (API_PORT, WEB_PORT, MYSQL_PORT, MONGO_PORT).
# Os padrões fogem de XAMPP (3306), PetConnect-API (27018/8090) e da 8080.

name: petconnect-web

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: petconnect_web
      MYSQL_USER: ${MYSQL_USER:-petconnect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MYSQL_URL: jdbc:mysql://mysql:3306/petconnect_web
      MYSQL_USER: ${MYSQL_USER:-petconnect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGODB_URI: mongodb://mongo:27017/petconnect_web
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (>= 32 caracteres) no .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8081}:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://api:8080
      COOKIE_SECURE: "false"   # local sem HTTPS; em produção remova (padrão = true)
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  mysql-data:
  mongo-data:
